<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Delta 97 | Glass Core</title>
    <style>
        :root { --glass: rgba(255, 255, 255, 0.15); --glass-border: rgba(255, 255, 255, 0.3); }
        body { 
            margin: 0; padding: 20px; font-family: -apple-system, sans-serif;
            background: linear-gradient(135deg, #1a1a1a, #4a4a4a); color: white; min-height: 100vh;
        }
        .container { max-width: 450px; margin: auto; padding: 20px; border-radius: 20px;
                     background: var(--glass); backdrop-filter: blur(15px); border: 1px solid var(--glass-border);
                     box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        h1 { margin: 0; font-size: 1.2rem; letter-spacing: 2px; text-transform: uppercase; }
        .url-tag { font-family: monospace; font-size: 0.65rem; color: #ccc; margin-bottom: 20px; }
        .grid-30 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 20px; }
        .slot { height: 45px; background: rgba(0,0,0,0.2); border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); }
        input { width: 100%; height: 100%; border: none; background: transparent; text-align: center; color: white; font-weight: bold; font-size: 1rem; }
        button { width: 100%; padding: 12px; background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border);
                 color: white; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        button:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>

<div class="container">
    <h1>DELTA 97</h1>
    <div class="url-tag">https://delta97.onrender.com</div>

    <div class="grid-30" id="histGrid"></div>

    <button onclick="localStorage.clear(); location.reload();">PURGE SESSION</button>
</div>

<script>
    const grid = document.getElementById('histGrid');
    for(let i=1; i<=30; i++) {
        grid.innerHTML += `<div class="slot"><input type="text" id="hn${i}" oninput="save()" placeholder="${i}"></div>`;
    }
    function save() {
        let data = {};
        for(let i=1; i<=30; i++) data[i] = document.getElementById(`hn${i}`).value;
        localStorage.setItem('delta_glass', JSON.stringify(data));
    }
    const saved = JSON.parse(localStorage.getItem('delta_glass') || "{}");
    for(let i in saved) document.getElementById(`hn${i}`).value = saved[i];
</script>
</body>
</html>
