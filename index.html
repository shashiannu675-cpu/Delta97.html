<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>v100 Omega | Neural Singularity</title>
    <style>
        :root { --accent: #000000; --bg: #ffffff; --card: #f2f2f7; --red: #ff3b30; --green: #34c759; --violet: #af52de; }
        body { margin: 0; padding: 0; background: var(--bg); font-family: -apple-system, sans-serif; color: #000; }
        .container { padding: 15px; max-width: 450px; margin: auto; }
        .bridge-url { font-family: monospace; font-size: 0.6rem; color: #888; text-align: center; margin-bottom: 5px; }

        /* HEADER */
        header { border-bottom: 2px solid var(--accent); margin-bottom: 10px; padding-bottom: 5px; display: flex; justify-content: space-between; align-items: flex-end; }
        h1 { font-size: 1.2rem; margin: 0; text-transform: uppercase; }

        /* AI ANALYTICS BOX */
        .ai-brain { background: var(--accent); color: #fff; padding: 15px; border-radius: 12px; margin-bottom: 15px; font-family: monospace; position: relative; overflow: hidden; }
        .ai-brain::after { content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient(0deg, rgba(0,255,0,0.03) 0px, rgba(0,255,0,0.03) 1px, transparent 1px, transparent 2px); pointer-events: none; }
        .ai-title { color: #00ffcc; font-size: 0.7rem; font-weight: bold; margin-bottom: 8px; display: block; }
        .ai-stat { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 4px; }
        #aiVerdict { color: #fff; font-size: 0.9rem; margin-top: 8px; border-top: 1px solid #333; padding-top: 8px; }

        /* MATRIX GRID */
        .grid-30 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-bottom: 15px; }
        .slot { height: 35px; display: flex; align-items: center; justify-content: center; background: #fff; border: 1px solid #d1d1d6; border-radius: 6px; position: relative; }
        .slot input { width: 100%; background: transparent; border: none; color: #000; font-size: 1em; text-align: center; outline: none; font-weight: 800; }
        .slot-idx { position: absolute; top: 1px; left: 2px; font-size: 0.45em; color: #8e8e93; }

        /* TIMER & MODES */
        .timer-module { background: var(--card); padding: 10px; border-radius: 12px; text-align: center; margin-bottom: 15px; border: 1px solid #d1d1d6; }
        #timer { font-size: 1.8em; font-family: monospace; font-weight: 900; }
        .mode-selector { display: flex; gap: 4px; margin-top: 5px; }
        .m-btn { flex: 1; font-size: 0.6rem; padding: 5px; border: 1px solid #000; background: #fff; cursor: pointer; font-weight: bold; }
        .m-btn.active { background: #000; color: #fff; }

        /* BUTTONS */
        .btn { width: 100%; padding: 15px; background: var(--accent); color: #fff; border: none; font-weight: bold; text-transform: uppercase; margin-bottom: 8px; cursor: pointer; }
        .btn-sec { background: #fff; color: #000; border: 2px solid #000; }
        .bg-red { background: var(--red) !important; color: white !important; }
        .bg-green { background: var(--green) !important; color: white !important; }
        .bg-violet { background: var(--violet) !important; color: white !important; }
    </style>
</head>
<body>

<div class="container">
    <div class="bridge-url">https://delta97.onrender.com</div>
    <header>
        <div><h1>OMEGA v100</h1><small>NEURAL CORE</small></div>
        <div style="text-align: right;"><b id="capText">₹1,000.00</b><br><small>DAY <span id="dayText">0</span></small></div>
    </header>

    <div class="ai-brain">
        <span class="ai-title">SYSTEM ANALYTICS // AI THINKING</span>
        <div class="ai-stat"><span>PROBABILITY RATE:</span> <span id="aiProb">0%</span></div>
        <div class="ai-stat"><span>PATTERN ENTROPY:</span> <span id="aiEntropy">LOW</span></div>
        <div class="ai-stat"><span>RIGGED DETECTION:</span> <span id="aiRigged">SCANNING...</span></div>
        <div id="aiVerdict">> AWAITING MATRIX INPUT...</div>
    </div>

    <div class="timer-module">
        <div id="timer">00:30</div>
        <div class="mode-selector">
            <button class="m-btn active" onclick="setTimer(30, this)">30s</button>
            <button class="m-btn" onclick="setTimer(60, this)">1m</button>
            <button class="m-btn" onclick="setTimer(300, this)">5m</button>
        </div>
    </div>

    <div class="grid-30" id="histGrid"></div>

    <button class="btn" onclick="growCapital()">Process +20% Growth</button>
    <button class="btn btn-sec" onclick="toggleTimer()" id="syncBtn">Start Auto-Sync</button>
</div>

<script>
    let capital = 1000, day = 0, timeLeft = 30, currentMode = 30, timerOn = false, interval;
    const grid = document.getElementById('histGrid');
    for(let i=1; i<=30; i++) {
        grid.innerHTML += `<div class="slot" id="slot${i}"><span class="slot-idx">${i}</span><input type="text" id="hn${i}" maxlength="1" inputmode="numeric" oninput="updateSlot(${i})"></div>`;
    }
    function updateSlot(i) {
        const input = document.getElementById(`hn${i}`), slot = document.getElementById(`slot${i}`), n = parseInt(input.value);
        slot.className = 'slot'; input.style.color = "#000";
        if (!isNaN(n)) {
            if (n === 0 || n === 5) { slot.classList.add('bg-violet'); input.style.color = "#fff"; }
            else if ([1, 3, 7, 9].includes(n)) { slot.classList.add('bg-green'); input.style.color = "#fff"; }
            else if ([2, 4, 6, 8].includes(n)) { slot.classList.add('bg-red'); input.style.color = "#fff"; }
            if(i === 1) runAIAnalytics();
        }
    }
    function runAIAnalytics() {
        const slots = [];
        for(let i=1; i<=30; i++) {
            const v = document.getElementById(`hn${i}`).value;
            if(v !== "") slots.push(parseInt(v));
        }
        if(slots.length === 0) return;
        let streak = 1, maxStreak = 1;
        for(let i=1; i<slots.length; i++) {
            if((slots[i] >= 5) === (slots[i-1] >= 5)) streak++;
            else { maxStreak = Math.max(maxStreak, streak); streak = 1; }
        }
        maxStreak = Math.max(maxStreak, streak);
        const isRigged = maxStreak >= 7;
        document.getElementById('aiRigged').innerText = isRigged ? "!!! HIGH RISK !!!" : "NORMAL";
        document.getElementById('aiRigged').style.color = isRigged ? "#ff3b30" : "#00ffcc";
        const lastN = slots[0];
        const prob = 85 + Math.floor(Math.random() * 12);
        const target = 9 - lastN;
        const size = lastN >= 5 ? "SMALL" : "BIG";
        document.getElementById('aiProb').innerText = prob + "%";
        document.getElementById('aiEntropy').innerText = slots.length > 10 ? "HIGH" : "STABLE";
        document.getElementById('aiVerdict').innerHTML = `> AI PREDICTION: ${size} [Target: ${target}]<br>> STATS: Logic confirms Mirror Reflection ${lastN}→${target}.`;
    }
    function setTimer(s, btn) {
        currentMode = s; timeLeft = s; updateTimerUI();
        document.querySelectorAll('.m-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }
    function updateTimerUI() {
        let m = Math.floor(timeLeft / 60), s = timeLeft % 60;
        document.getElementById('timer').innerText = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
    }
    function toggleTimer() {
        if(timerOn) { clearInterval(interval); timerOn = false; document.getElementById('syncBtn').innerText = "Start Auto-Sync"; }
        else {
            timerOn = true; document.getElementById('syncBtn').innerText = "Stop Sync";
            interval = setInterval(() => {
                timeLeft--; if(timeLeft < 0) { timeLeft = currentMode; shiftGrid(); } updateTimerUI();
            }, 1000);
        }
    }
    function shiftGrid() {
        for(let i=30; i>1; i--) { document.getElementById(`hn${i}`).value = document.getElementById(`hn${i-1}`).value; updateSlot(i); }
        document.getElementById('hn1').value = ""; updateSlot(1);
    }
    function growCapital() {
        capital *= 1.20; day++;
        document.getElementById('capText').innerText = "₹" + capital.toLocaleString('en-IN', {minimumFractionDigits: 2});
        document.getElementById('dayText').innerText = day;
    }
</script>
</body>
</html>
